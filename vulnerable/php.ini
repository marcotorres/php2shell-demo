; ------------------------------------------------------------------
; Configuración INSEGURA a propósito (laboratorio).
; Cada línea aquí es una de las precondiciones que un escáner de
; php2shell busca para marcarte como blanco viable.
; ------------------------------------------------------------------
display_errors = On                     ; filtra estado interno al atacante
expose_php = On                         ; revela la versión en X-Powered-By
memory_limit = 16M                      ; límite minúsculo = OOM trivial de forzar
session.use_strict_mode = 0             ; permite fijar el PHPSESSID
session.upload_progress.enabled = 1     ; vía confirmada hacia CVE-2026-109619
file_uploads = On
post_max_size = 32M
upload_max_filesize = 32M
