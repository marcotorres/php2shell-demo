; ------------------------------------------------------------------
; Configuración ENDURECIDA — reduce la superficie que busca el escáner.
; Recuerda: esto MITIGA, no cura. La cura es PARCHEAR PHP.
; ------------------------------------------------------------------
display_errors = Off                    ; nunca filtres errores al cliente
log_errors = On                         ; pero sí a tus logs
expose_php = Off                        ; sin X-Powered-By
session.use_strict_mode = 1             ; rechaza PHPSESSID no emitidos por ti
session.upload_progress.enabled = 0     ; apaga la vía confirmada del CVE
file_uploads = Off                      ; si no subes archivos, ciérralo
post_max_size = 1M
upload_max_filesize = 1M
